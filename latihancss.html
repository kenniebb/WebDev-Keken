<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Latihan CSS</title>
    <style>
        p{
            font-family:Georgia, 'Times New Roman', Times, serif;
            color:rgb(20, 134, 134);
            font-weight: 500;
        }
        .momo{
            font-style:italic;
            color:darkslateblue;
            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif
        }
        .niche{
            font-style:oblique;
            color:rgb(104, 48, 48);
            font-family:Verdana, Geneva, Tahoma, sans-serif
        }
    </style>

</head>
<body>
    <p style="font-weight: bold; color: #dc143c;">Ini adalah kalimat pertama</p>
    <p>Ini adalah kalimat kedua</p>
    <p class="momo">Ini adalah kalimat ketiga</p>
    <p class="niche">Ini adalah kalimat keempat</p>
</body>
</html>
